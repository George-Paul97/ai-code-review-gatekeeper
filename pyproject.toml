[project]
name = "ai-guard"
version = "0.1.0"
description = "AI code review gatekeeper (security & quality checks) for PRs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-guard = "ai_guard.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

# IMPORTANT: don't run S rules for tests/fixtures and neither S101 in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]              # allow assert in pytest tests
"tests/fixtures/**" = ["S307"]     # allow eval() in fixtures (intentional)


[tool.pytest.ini_options]
testpaths = ["tests"]
