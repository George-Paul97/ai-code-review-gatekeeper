name: AI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ai-guard (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compute changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -E '\.(py|js|ts|jsx|tsx|php|rb|go)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run AI Guard (PR diff)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ steps.changed.outputs.files }}" ]; then
            echo "No relevant changed files. Skipping scan."
            echo "✅ No relevant changed files to scan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### AI Guard Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Files scanned:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.changed.outputs.files }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Run scan; put markdown in job summary
          ai-guard scan ${{ steps.changed.outputs.files }} --fail-on-findings > ai_guard_report.md || true
          cat ai_guard_report.md >> "$GITHUB_STEP_SUMMARY"

          # Fail job if findings exist
          ai-guard scan ${{ steps.changed.outputs.files }} --fail-on-findings
