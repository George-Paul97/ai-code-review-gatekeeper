name: AI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ai-guard (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compute changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -E '\.(py|js|ts|jsx|tsx|php|rb|go)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run AI Guard (PR diff)
        shell: bash
        run: |
          set -euo pipefail

          files_raw="${{ steps.changed.outputs.files }}"
          if [ -z "$files_raw" ]; then
            echo "No relevant changed files. Skipping scan."
            echo "✅ No relevant changed files to scan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### AI Guard Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Files scanned:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$files_raw" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Build an array from the newline-separated output
          mapfile -t files <<< "$files_raw"

          # Run once, capture output + exit code
          set +e
          ai-guard scan "${files[@]}" --fail-on-findings > ai_guard_report.md
          status=$?
          set -e

          cat ai_guard_report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
